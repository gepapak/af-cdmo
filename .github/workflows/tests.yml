name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Verify code-only release manifest
        if: ${{ hashFiles('release_manifest.json') != '' }}
        run: python scripts\verify_release_manifest.py
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run public test suite
        run: python -m pytest tests -q
